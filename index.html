<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3DShoot - Low Poly Mobile Shooter</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  #canvas{display:block;width:100%;height:100%}
  .ui{position:absolute;pointer-events:none;width:100%;height:100%;top:0;left:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
  .ui *{pointer-events:auto}
  .hud-top{display:flex;justify-content:space-between;padding:14px 16px;font-size:15px;font-weight:700;letter-spacing:.5px}
  .hud-panel{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 14px;backdrop-filter:blur(6px)}
  .hud-panel b{display:block;font-size:12px;opacity:.75}
  .crosshair{position:absolute;top:50%;left:50%;width:24px;height:24px;transform:translate(-50%,-50%);border:2px solid rgba(0,255,120,.9);border-radius:50%;pointer-events:none}
  .crosshair::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;background:#0f0;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 8px #0f0}
  .mobile-controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
  .ctrl-side{pointer-events:auto;display:flex;flex-direction:column;align-items:center}
  .joystick{position:relative;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
  .joystick-stick{position:absolute;width:52px;height:52px;background:rgba(255,255,255,.55);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.8);box-shadow:0 0 12px rgba(0,0,0,.4)}
  .look-zone{position:absolute;top:0;right:0;width:55%;height:78%}
  .btn{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none;tap-highlight-color:transparent}
  .btn:active{background:rgba(255,255,255,.35);transform:scale(.92)}
  .btn.fire{background:#e74c3c;border-color:#c0392b;width:78px;height:78px;font-size:20px}
  .row{display:flex;gap:10px}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;color:#fff;font-family:system-ui}
  .overlay.hidden{display:none}
  .btn-big{margin-top:14px;padding:12px 26px;border:2px solid #fff;background:transparent;color:#fff;font-size:17px;font-weight:700;border-radius:8px;cursor:pointer}
  .btn-big:hover{background:rgba(255,255,255,.12)}
  .title{font-size:42px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;text-shadow:0 0 20px rgba(0,255,120,.4)}
  .subtitle{opacity:.8;margin-bottom:24px;font-size:16px}
  .mode-grid{display:grid;grid-template-columns:repeat(2,140px);gap:14px;margin-bottom:18px}
  .mode{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);color:#fff;padding:12px 8px;border-radius:10px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;user-select:none}
  .mode.active{border-color:#0f0;background:rgba(0,255,120,.15)}
  .mode small{display:block;font-size:11px;opacity:.7;font-weight:400;margin-top:4px}
  .killfeed{position:absolute;bottom:150px;left:16px;right:16px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-height:140px}
  .kill{background:rgba(0,0,0,.5);border-left:3px solid #0f0;padding:4px 8px;border-radius:4px;font-size:13px;opacity:0;animation:kf .5s forwards, kfout 1s 2.5s forwards}
  @keyframes kf{to{opacity:1;transform:translateY(0)}}
  @keyframes kfout{to{opacity:0;transform:translateY(-8px)}}
  .ammo{position:absolute;bottom:90px;right:16px;text-align:right;font-size:18px;font-weight:800;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6)}
  .ammo small{display:block;font-size:12px;color:#fff;opacity:.8}
  .status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px;font-weight:700;pointer-events:none}
  .health-bar{position:absolute;left:16px;top:80px;width:150px;height:14px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.3);border-radius:7px;overflow:hidden}
  .health-fill{height:100%;background:#0f0;width:100%;transition:width .15s,background .15s}
  @media (min-width:768px){.mobile-controls,.look-zone{display:none}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="ui">
  <div class="hud-top">
    <div class="hud-panel"><b>MODE</b><span id="hudMode">DEATHMATCH</span></div>
    <div class="hud-panel"><b>SCORE</b><span id="hudScore">0</span></div>
  </div>
  <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
  <div class="crosshair"></div>
  <div class="killfeed" id="killfeed"></div>
  <div class="ammo"><span id="hudAmmo">30</span><small>/ <span id="hudAmmoReserve">90</span></small></div>
  <div class="status" id="status"></div>

  <div class="look-zone" id="lookZone"></div>
  <div class="mobile-controls">
    <div class="ctrl-side">
      <div class="joystick"><div class="joystick-stick" id="joyStick"></div></div>
    </div>
    <div class="ctrl-side">
      <div class="row" style="margin-bottom:10px">
        <div class="btn" id="btnJump">JUMP</div>
        <div class="btn" id="btnCrouch">CROUCH</div>
      </div>
      <div class="row">
        <div class="btn" id="btnReload">RELOAD</div>
        <div class="btn" id="btnWeapon">WEAPON</div>
      </div>
      <div class="btn fire" id="btnFire">FIRE</div>
    </div>
  </div>
</div>

<div class="overlay" id="mainMenu">
  <div class="title">3DShoot</div>
  <div class="subtitle">Low Poly Mobile FPS &bull; Offline Bots</div>
  <div style="margin:10px 0 6px 0">
    <input id="wsUrl" type="text" placeholder="ws://your-ip:8080 (leave blank for offline)" style="padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;width:260px;max-width:80%;font-size:13px">
  </div>
  <button class="btn-big" id="btnConnectMP" style="opacity:.65">Connect Multiplayer</button>
  <div class="mode-grid">
    <div class="mode active" data-mode="dm">DEATHMATCH<div class="small">Free For All vs Bots</div></div>
    <div class="mode" data-mode="tdm">TEAM DM<div class="small">Red vs Blue Bots</div></div>
    <div class="mode" data-mode="survival">SURVIVAL<div class="small">Zombie Waves</div></div>
  </div>
  <button class="btn-big" id="btnStart">Start Game</button>
  <div style="margin-top:10px;opacity:.7;font-size:12px">Multiplayer: host server.js, join same Wi-Fi</div>
</div>

<div class="overlay" id="deathScreen" hidden>
  <div class="title" style="font-size:30px;color:#e74c3c">ELIMINATED</div>
  <div class="subtitle" id="deathMsg"></div>
  <button class="btn-big" id="btnRespawn">Respawn</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/*============================ CONFIG ============================*/
const CFG = {
  playerSpeed: 5.6,
  playerSprint: 8.6,
  playerCrouch: 3.0,
  jumpForce: 7.6,
  gravity: 26,
  friction: 8,
  mouseSens: 0.0022,
  touchSens: 0.0035,
  botCount: 8,
  botAccuracy: 0.55,
  botReaction: 700,
  mapSize: 200,
  respawnTime: 2.2
};

const MODES = ['dm','tdm','survival'];
let currentMode = 'dm';

/*============================ INPUT ============================*/
const input = {
  forward:0, right:0, jump:false, sprint:false, crouch:false,
  lookX:0, lookY:0, pitch:0, yaw:0,
  fire:false, reload:false, switchW:false,
  touchLook:false,
  joy:{active:false,start:{x:0,y:0},pos:{x:0,y:0},delta:{x:0,y:0}}
};

window.addEventListener('keydown',e=>{
  if(e.code==='KeyW')input.forward=1;else if(e.code==='KeyS')input.forward=-1;
  if(e.code==='KeyD')input.right=1;else if(e.code==='KeyA')input.right=-1;
  if(e.code==='ShiftLeft')input.sprint=true;
  if(e.code==='ControlLeft')input.crouch=true;
  if(e.code==='Space')input.jump=true;
  if(e.code==='KeyR')input.reload=true;
  if(e.code==='KeyQ')input.switchW=true;
  if(e.code==='Escape'){document.getElementById('mainMenu').hidden=false;document.getElementById('deathScreen').hidden=true;}
});
window.addEventListener('keyup',e=>{
  if(e.code==='KeyW'&&input.forward===1)input.forward=0;
  if(e.code==='KeyS'&&input.forward===-1)input.forward=0;
  if(e.code==='KeyD'&&input.right===1)input.right=0;
  if(e.code==='KeyA'&&input.right===-1)input.right=0;
  if(e.code==='ShiftLeft')input.sprint=false;
  if(e.code==='ControlLeft')input.crouch=false;
  if(e.code==='Space')input.jump=false;
  if(e.code==='KeyR')input.reload=false;
  if(e.code==='KeyQ')input.switchW=false;
});
window.addEventListener('mousedown',e=>{if(e.button===0)input.fire=true;if(e.button===2)input.fire=false;});
window.addEventListener('mouseup',e=>{if(e.button===0)input.fire=false;});
window.addEventListener('mousemove',e=>{
  if(document.pointerLockElement){input.lookX=e.movementX;input.lookY=e.movementY;}
});

/*============================ TOUCH ============================*/
const joyEl=document.getElementById('joyStick');
const joyBox=joyEl.parentElement;
const lookZone=document.getElementById('lookZone');
const isMobile=/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

function getTouchPos(e){const t=e.touches[0]||e.changedTouches[0];return{x:t.clientX,y:t.clientY};}

joyBox.addEventListener('touchstart',e=>{
  e.preventDefault();const p=getTouchPos(e);
  input.joy.active=true;input.joy.start=p;input.joy.pos=p;input.joy.delta={x:0,y:0};
  updateJoyStick();
},{passive:false});
joyBox.addEventListener('touchmove',e=>{
  e.preventDefault();if(!input.joy.active)return;
  const p=getTouchPos(e);input.joy.pos=p;
  const dx=(p.x-input.joy.start.x)/(joyBox.clientWidth/2);
  const dy=(p.y-input.joy.start.y)/(joyBox.clientHeight/2);
  input.joy.delta={x:Math.max(-1,Math.min(1,dx)),y:Math.max(-1,Math.min(1,dy))};
  updateJoyStick();
},{passive:false});
joyBox.addEventListener('touchend',e=>{
  e.preventDefault();input.joy.active=false;input.joy.delta={x:0,y:0};updateJoyStick();
},{passive:false});

function updateJoyStick(){
  if(input.joy.active){
    joyEl.style.transform=`translate(calc(-50% + ${input.joy.delta.x*28}px), calc(-50% + ${input.joy.delta.y*28}px))`;
  }else{joyEl.style.transform='translate(-50%,-50%)';}
}

lookZone.addEventListener('touchstart',e=>{e.preventDefault();input.touchLook=true;});
lookZone.addEventListener('touchmove',e=>{
  e.preventDefault();if(!input.touchLook)return;
  const t=e.touches[0];input.lookX=t.movementX||0;input.lookY=t.movementY||0;
},{passive:false});
lookZone.addEventListener('touchend',e=>{e.preventDefault();input.touchLook=false;});

const btnFire=document.getElementById('btnFire');
const btnJump=document.getElementById('btnJump');
const btnCrouch=document.getElementById('btnCrouch');
const btnReload=document.getElementById('btnReload');
const btnWeapon=document.getElementById('btnWeapon');
function bindBtn(el,down,up){
  el.addEventListener('touchstart',e=>{e.preventDefault();if(down)down();});
  el.addEventListener('touchend',e=>{e.preventDefault();if(up)up();});
  el.addEventListener('mousedown',e=>{e.preventDefault();if(down)down();});
  el.addEventListener('mouseup',e=>{e.preventDefault();if(up)up();});
}
bindBtn(btnFire,()=>{input.fire=true},()=>{input.fire=false});
bindBtn(btnJump,()=>{input.jump=true});
bindBtn(btnCrouch,()=>{input.crouch=!input.crouch;});
bindBtn(btnReload,()=>{input.reload=true});
bindBtn(btnWeapon,()=>{input.switchW=true});

/*============================ ASSETS / AUDIO ============================*/
const AudioCtx=window.AudioContext||window.webkitAudioContext;
const audio=new AudioCtx();
function playTone(type,freq,duration,vol=0.08){
  if(audio.state==='suspended')audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
  g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);
}
function sfxShoot(){playTone('square',1200,0.06,0.05);setTimeout(()=>playTone('square',600,0.03,0.04),40);}
function sfxHit(){playTone('sine',900,0.08,0.1);}
function sfxJump(){playTone('sine',400,0.06,0.06);}
function sfxDie(){playTone('sawtooth',150,0.4,0.1);setTimeout(()=>playTone('sawtooth',90,0.4,0.1),200);}
function sfxPick(){playTone('sine',1100,0.05,0.06);}

/*============================ SCENE ============================*/
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1b2a3a);
scene.fog=new THREE.FogExp2(0x1b2a3a,0.018);

const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);

// Lighting
const amb=new THREE.AmbientLight(0xffffff,0.55);scene.add(amb);
const dir=new THREE.DirectionalLight(0xffffff,1.1);dir.position.set(50,100,50);dir.castShadow=true;dir.shadow.mapSize.set(2048,2048);dir.shadow.camera.near=1;dir.shadow.camera.far=300;dir.shadow.camera.left=-100;dir.shadow.camera.right=100;dir.shadow.camera.top=100;dir.shadow.camera.bottom=-100;scene.add(dir);
const fill=new THREE.PointLight(0x4a9eff,0.6);fill.position.set(-40,30,20);scene.add(fill);

// Ground
const groundGeo=new THREE.PlaneGeometry(CFG.mapSize*2,CFG.mapSize*2);
const groundMat=new THREE.MeshStandardMaterial({color:0x2d4a3a,roughness:1,flatShading:true});
const ground=new THREE.Mesh(groundGeo,groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.name='ground';scene.add(ground);

// Grid helper for low poly feel
const grid=new THREE.GridHelper(CFG.mapSize*2,40,0x3e5a52,0x253830);scene.add(grid);

/*============================ MAP BUILD (low poly rooms) ============================*/
const walls=[];const covers=[];const spawns=[];

function addWall(x,y,z,w,h,d,color=0x5a6b7b){
  const g=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.MeshStandardMaterial({color,flatShading:true,roughness:1});
  const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
  scene.add(o);walls.push(o);return o;
}
function addCover(x,y,z,sx,sy,sz,color=0x6b5b4b){
  const g=new THREE.BoxGeometry(sx,sy,sz);
  const m=new THREE.MeshStandardMaterial({color,flatShading:true,roughness:1});
  const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
  scene.add(o);covers.push(o);return o;
}

// Outer boundary
addWall(0,12,-CFG.mapSize,CFG.mapSize*2,24,4); // back
addWall(0,12,CFG.mapSize,CFG.mapSize*2,24,4); // front
addWall(-CFG.mapSize,12,0,4,24,CFG.mapSize*2); // left
addWall(CFG.mapSize,12,0,4,24,CFG.mapSize*2); // right

// Rooms / cover layout (low poly blocks)
const rooms=[
  [-40,0,-40,30,20,30],[40,0,-40,30,20,30],[-40,0,40,30,20,30],[40,0,40,30,20,30],
  [-60,0,0,22,18,22],[60,0,0,22,18,22],[0,0,-60,22,18,22],[0,0,60,22,18,22]
];
rooms.forEach(([x,y,z,w,h,d])=>addWall(x,h/2,z,w,h,d,0x4b5a66));

// Covers
const coverList=[
  [-25,2,-30,8,4,6],[25,2,-30,8,4,6],[-25,2,30,8,4,6],[25,2,30,8,4,6],
  [-45,2,0,10,4,5],[45,2,0,10,4,5],[0,2,-45,5,4,10],[0,2,45,5,4,10],
  [-15,2,-12,6,4,6],[15,2,-12,6,4,6],[-15,2,12,6,4,6],[15,2,12,6,4,6]
];
coverList.forEach(c=>addCover(...c));

// Spawn points
const spawnList=[
  [-70,2,-70],[70,2,-70],[-70,2,70],[70,2,70],
  [-50,2,0],[50,2,0],[0,2,-50],[0,2,50],
  [-30,2,30],[30,2,-30]
];
spawnList.forEach(s=>spawns.push(new THREE.Vector3(...s)));

/*============================ PLAYER / WEAPONS ============================*/
const WEAPONS=[
  {name:'Assault',dmg:22,rof:90,range:90,spread:0.009,ammo:30,reserve:90,reloadTime:1.6,recoil:0.7,color:0x3aa9ff},
  {name:'Shotgun',dmg:12,rof:420,range:30,spread:0.16,ammo:8,reserve:32,reloadTime:2.2,recoil:1.4,color:0xffb347,pellets:8},
  {name:'SMG',dmg:14,rof:45,range:60,spread:0.014,ammo:32,reserve:128,reloadTime:1.4,recoil:0.5,color:0x7ed3ff},
];
let wIdx=0;

const player={
  pos:new THREE.Vector3(0,2,0),
  vel:new THREE.Vector3(),
  onGround:false,crouch:false,sprint:false,
  health:100,maxHealth:100,
  yaw:0,pitch:0,
  weapon:{...WEAPONS[0],ammo:WEAPONS[0].ammo,reserve:WEAPONS[0].reserve},
  lastShot:0,reloading:false,reloadEnd:0,
  dead:false,respawnTimer:0,
  kickX:0,kickY:0,
  team:'player',
  score:0
};

function setWeapon(i){
  wIdx=i%WEAPONS.length;
  const base=WEAPONS[wIdx];
  player.weapon={...base,ammo:base.ammo,reserve:base.reserve};
  player.reloading=false;
  updateHUD();
}
function startReload(){
  if(player.reloading||player.weapon.ammo>=player.weapon.ammoMax||player.weapon.reserve<=0)return;
  const base=WEAPONS[wIdx];
  player.reloading=true;
  player.reloadEnd=performance.now()/1000+base.reloadTime;
  setTimeout(()=>{
    const need=base.ammo-player.weapon.ammo;
    const take=Math.min(need,player.weapon.reserve);
    player.weapon.ammo+=take;player.weapon.reserve-=take;
    player.reloading=false;
    updateHUD();
  },base.reloadTime*1000);
}
function shoot(){
  if(player.dead||player.reloading)return;
  const now=performance.now()/1000;
  const w=player.weapon;
  if(now-player.lastShot<60/w.rof)return;
  if(w.ammo<=0){if(w.reserve>0){startReload();}return;}
  player.lastShot=now;w.ammo--;
  player.kickX+=(Math.random()-0.5)*0.5;player.kickY+=w.recoil*0.012;
  sfxShoot();
  const pellets=w.pellets||1;
  for(let p=0;p<pellets;p++){
    const dir=new THREE.Vector3(
      (Math.random()-0.5)*w.spread*2,
      (Math.random()-0.5)*w.spread*2,
      -1
    );
    dir.applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ')).normalize();
    const ray=new THREE.Raycaster(player.pos.clone().add(new THREE.Vector3(0,1.55,0)),dir,w.range);
    const hits=ray.intersectObjects([...bots.map(b=>b.mesh),...covers,ground],true);
    if(hits.length){
      const hit=hits[0];
      const bot=bots.find(b=>b.mesh===hit.object||b.mesh===hit.object.parent||hit.object.name==='botMesh'&&b.mesh===hit.object);
      if(bot){damageBot(bot,w.dmg,player);sfxHit();}
    }
    updateHUD();
  }
}

function spawnMuzzleFlash(){
  const g=new THREE.SphereGeometry(0.12,6,6);
  const m=new THREE.MeshBasicMaterial({color:player.weapon.color});
  const flash=new THREE.Mesh(g,m);
  const pos=player.pos.clone().add(new THREE.Vector3(0,1.55,0));
  pos.add(new THREE.Vector3(0,0,-0.6).applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ')));
  flash.position.copy(pos);scene.add(flash);
  setTimeout(()=>scene.remove(flash),60);
}

function damagePlayer(amount,by){
  if(player.dead)return;
  player.health=Math.max(0,player.health-amount);
  updateHUD();
  const el=document.getElementById('status');
  el.textContent='TAKING FIRE';el.style.color='#e74c3c';
  setTimeout(()=>{if(!player.dead){el.textContent='';}},1000);
  if(player.health<=0)killPlayer(by);
}

function killPlayer(by){
  player.dead=true;player.respawnTimer=performance.now()/1000+CFG.respawnTime;
  sfxDie();
  document.getElementById('deathScreen').hidden=false;
  document.getElementById('deathMsg').textContent=by?`Eliminated by ${by.name}`:`Eliminated`;
  addKillfeed((by?by.name:'unknown')+' eliminated you','#e74c3c');
  updateHUD();
}
function respawnPlayer(){
  const s=spawns[Math.floor(Math.random()*spawns.length)];
  player.pos.copy(s);player.vel.set(0,0,0);player.health=player.maxHealth;
  player.dead=false;player.reloading=false;
  setWeapon(wIdx);
  player.respawnTimer=0;
  document.getElementById('deathScreen').hidden=true;
  document.getElementById('status').textContent='';
  updateHUD();
}

/*============================ BOTS ============================*/
const bots=[];

function spawnBot(team){
  const s=spawns[Math.floor(Math.random()*spawns.length)];
  const h=Math.random()*Math.PI*2;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.8,0.7),new THREE.MeshStandardMaterial({color:team==='red'?0xff4444:team==='blue'?0x4488ff:0xaa6633,flatShading:true}));
  mesh.position.copy(s);mesh.position.y+=0.9;mesh.castShadow=true;mesh.receiveShadow=true;mesh.name='botMesh';
  scene.add(mesh);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.55),new THREE.MeshStandardMaterial({color:0xedd4c2,flatShading:true}));
  head.position.y=1.15;mesh.add(head);
  const gun=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.5,0.12),new THREE.MeshStandardMaterial({color:0x222,flatShading:true}));
  gun.position.set(0.45,0.25,0.35);mesh.add(gun);
  const bot={
    mesh,team,health:100,maxHealth:100,pos:s.clone(),
    vel:new THREE.Vector3(),yaw:h,pitch:0,
    state:'idle',idleTimer:0,reactTimer:0,lastShot:0,
    target:null,wander:new THREE.Vector3(),
    name:team==='red'?'Red Bot':team==='blue'?'Blue Bot':'Zombie',
    dead:false,type:team==='survival'?'zombie':'bot'
  };
  bots.push(bot);
  return bot;
}
function initBots(){
  bots.forEach(b=>scene.remove(b.mesh));bots.length=0;
  const n=currentMode==='survival'?6:CFG.botCount;
  for(let i=0;i<n;i++){
    spawnBot(currentMode==='tdm'?(i%2?'red':'blue'):currentMode==='survival'?'survival':null);
  }
}
function botWeapon(bot){return{name:'bot',rof:currentMode==='survival'?99999:260,dmg:currentMode==='survival'?35:20,range:currentMode==='survival'?8:70,spread:currentMode==='survival'?0.5:0.07};}

function damageBot(bot,amount,by){
  if(bot.dead)return;
  bot.health-=amount;sfxHit();
  if(bot.health<=0)killBot(bot,by);
}
function killBot(bot,by){
  bot.dead=true;bot.health=0;
  bot.mesh.material.color.setHex(0x222);
  bot.mesh.scale.set(1,0.35,1);bot.mesh.position.y=0.4;
  scene.remove(bot.mesh);
  if(by&&by===player){player.score+=currentMode==='survival'?20:100;addKillfeed(`You killed ${bot.name}`,'#0f0');updateHUD();}
  setTimeout(()=>{if(bots.includes(bot)){const i=bots.indexOf(bot);if(i>=0)bots.splice(i,1);}},600);
  if(currentMode==='survival')setTimeout(()=>spawnBot('survival'),1500);
}

let ws=null,netId=Date.now()+''+Math.random(),netState={players:{}},remoteMeshes={};
function connectMultiplayer(url){
  if(!url)return;
  ws=new WebSocket(url);
  ws.onopen=()=>{
    ws.send(JSON.stringify({t:'join',name:'Player',id:netId,team:'red'}));
    document.getElementById('btnConnectMP').textContent='Connected';
    document.getElementById('btnConnectMP').style.opacity=1;
  };
  ws.onmessage=e=>{
    try{netState=JSON.parse(e.data);}catch(e){}
  };
  ws.onclose=()=>{ws=null;document.getElementById('btnConnectMP').textContent='Disconnected';};
}
function netSend(obj){if(ws&&ws.readyState===1)ws.send(JSON.stringify(obj));}
document.getElementById('btnConnectMP').addEventListener('click',()=>{
  const u=document.getElementById('wsUrl').value.trim();
  if(u)connectMultiplayer(u);
});

/*============================ RAYCAST HELPERS ============================*/
const playerRayOrigin=new THREE.Vector3();
const moveDir=new THREE.Vector3();

function updatePlayer(dt){
  if(player.dead){
    player.respawnTimer-=dt;
    if(player.respawnTimer<=0)respawnPlayer();
    return;
  }
  // look
  const sens=isMobile?CFG.touchSens:CFG.mouseSens;
  player.yaw-=input.lookX*sens;
  player.pitch-=input.lookY*sens;
  player.pitch=Math.max(-Math.PI/2+0.02,Math.min(Math.PI/2-0.02,player.pitch));
  input.lookX=0;input.lookY=0;

  // movement input
  const joy=input.joy;
  let mx=input.right+joy.delta.x;
  let mz=input.forward+joy.delta.y;
  const len=Math.sqrt(mx*mx+mz*mz);
  if(len>0){mx/=len;mz/=len;}

  const speed=player.crouch?CFG.playerCrouch:(input.sprint?CFG.playerSprint:CFG.playerSpeed);
  const cos=Math.cos(player.yaw),sin=Math.sin(player.yaw);
  moveDir.set(mx*cos - mz*sin,0,mx*sin + mz*cos);

  // crouch height
  const standH=1.65;const crouchH=1.0;
  const targetH=player.crouch?crouchH:standH;
  const curH=player.pos.y- (player.crouch?crouchH:standH) ; // rough
  // smooth height handled via camera offset

  // acceleration
  const acc=14;
  player.vel.x+=moveDir.x*acc*dt;player.vel.z+=moveDir.z*acc*dt;
  // friction
  player.vel.x*=Math.pow(1-CFG.friction*dt,dt*60);player.vel.z*=Math.pow(1-CFG.friction*dt,dt*60);

  // gravity / jump
  if(!player.onGround){player.vel.y-=CFG.gravity*dt;}
  else{
    if(input.jump){player.vel.y=CFG.jumpForce;player.onGround=false;sfxJump();}
    player.vel.y=0;
  }
  // apply
  player.pos.x+=player.vel.x*dt;player.pos.z+=player.vel.z*dt;
  player.pos.y+=player.vel.y*dt;

  // ground snap (simple)
  if(player.pos.y<2){player.pos.y=2;player.vel.y=0;player.onGround=true;}
  else{player.onGround=false;}

  // clamp to map
  const m=CFG.mapSize-2;
  player.pos.x=Math.max(-m,Math.min(m,player.pos.x));
  player.pos.z=Math.max(-m,Math.min(m,player.pos.z));

  // fire
  if(input.fire)shoot();
  if(input.reload)startReload();
  if(input.switchW){setWeapon(wIdx+1);input.switchW=false;}
  // smooth kick decay
  player.kickX*=0.85;player.kickY*=0.85;

  // camera
  camera.position.set(player.pos.x,player.pos.y+(player.crouch?1.0:1.55)+player.kickY*2,player.pos.z);
  camera.rotation.set(player.pitch+player.kickY*1.2,player.yaw+player.kickX*0.8,0);
  camera.updateMatrixWorld();

  netSend({t:'state',id:netId,name:'Player',team:'red',x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.yaw,pitch:player.pitch,health:player.health});

  // health regen none; status fade
  const st=document.getElementById('status');
  if(st.textContent&&Date.now()>0){}
  updateHUD();
}

let lastBotThink=0;
function updateBots(dt){
  const now=performance.now()/1000;
  const playerEye=player.pos.clone().add(new THREE.Vector3(0,1.55,0));
  bots.forEach(bot=>{
    if(bot.dead)return;
    const w=botWeapon(bot);
    // see player
    const dirToPlayer=new THREE.Vector3().subVectors(playerEye,bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)));
    const dist=dirToPlayer.length();dirToPlayer.normalize();
    const fwd=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,bot.yaw,0,'YXZ'));
    const dot=dirToPlayer.dot(fwd);
    const canSee=dot>0.45&&dist<w.range;
    const ray=new THREE.Raycaster(bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0)),dirToPlayer,w.range);
    const hits=ray.intersectObjects([...covers,ground],true);
    const blocked=hits.length&&hits[0].distance<dist-0.5;
    if(canSee&&!blocked){
      bot.target=player;bot.reactTimer=0;bot.state='chase';
    }else{
      bot.reactTimer+=dt*1000;
      if(bot.reactTimer>CFG.botReaction&&Math.random()<0.02){bot.state='idle';bot.reactTimer=0;}
    }

    if(bot.state==='chase'&&bot.target&&!bot.target.dead){
      // rotate to target
      const targetYaw=Math.atan2(bot.target.pos.x-bot.mesh.position.x,bot.target.pos.z-bot.mesh.position.z);
      bot.yaw+=(targetYaw-bot.yaw+Math.PI)%(Math.PI*2)-Math.PI;
      bot.yaw=(bot.yaw+Math.PI*2)%(Math.PI*2);
      // move closer
      if(dist>2.6){
        bot.mesh.position.x+=Math.sin(bot.yaw)*3.2*dt;
        bot.mesh.position.z+=-Math.cos(bot.yaw)*3.2*dt;
      }
      // shoot
      if(dist<w.range&&now-bot.lastShot>60/w.rof){
        bot.lastShot=now;
        if(Math.random()<CFG.botAccuracy){
          damagePlayer(w.dmg,bot);
        }
        // bot muzzle
        const g=new THREE.SphereGeometry(0.1,4,4);const m=new THREE.MeshBasicMaterial({color:0xff4444});
        const f=new THREE.Mesh(g,m);f.position.copy(bot.mesh.position).add(new THREE.Vector3(0,1.2,0)).add(new THREE.Vector3(0,0,-0.5).applyEuler(new THREE.Euler(0,bot.yaw,0,'YXZ')));
        scene.add(f);setTimeout(()=>scene.remove(f),50);
      }
    }else{
      // wander/idle
      bot.idleTimer+=dt;
      if(bot.idleTimer>3||bot.state==='idle'){
        if(Math.random()<0.03)bot.wander.set((Math.random()-0.5)*25,0,(Math.random()-0.5)*25);
        bot.idleTimer=0;
      }
      const targetYaw=Math.atan2(bot.wander.x-bot.mesh.position.x,bot.wander.z-bot.mesh.position.z);
      bot.yaw+=(targetYaw-bot.yaw+Math.PI)%(Math.PI*2)-Math.PI;
      bot.mesh.position.x+=Math.sin(bot.yaw)*2*dt;
      bot.mesh.position.z+=-Math.cos(bot.yaw)*2*dt;
    }
    // keep bot upright
    bot.mesh.position.y=1.2;
    bot.mesh.rotation.y=bot.yaw;
  });
  // respawn bots to keep count
  const need=currentMode==='survival'?6:CFG.botCount;
  while(bots.filter(b=>!b.dead).length<need){
    const team=currentMode==='tdm'?(bots.filter(b=>!b.dead&&b.team==='red').length<=bots.filter(b=>!b.dead&&b.team==='blue').length?'red':'blue'):currentMode==='survival'?'survival':null;
    spawnBot(team);
  }
}

/*============================ HUD / KILLFEED ============================*/
function updateHUD(){
  if(player.dead)return;
  document.getElementById('hudMode').textContent=currentMode.toUpperCase();
  document.getElementById('hudScore').textContent=player.score;
  const hf=document.getElementById('healthFill');hf.style.width=player.health+'%';hf.style.background=player.health>40?'#0f0':(player.health>15?'#ffb300':'#e74c3c');
  document.getElementById('hudAmmo').textContent=player.weapon.ammo;
  document.getElementById('hudAmmoReserve').textContent=player.weapon.reserve;
}
function addKillfeed(text,color){
  const k=document.createElement('div');k.className='kill';k.textContent=text;k.style.borderLeftColor=color||'#fff';
  const feed=document.getElementById('killfeed');feed.appendChild(k);
  setTimeout(()=>k.remove(),3500);
}

/*============================ MODE SELECT ============================*/
const modesEl=document.querySelectorAll('.mode');
modesEl.forEach(el=>{
  el.addEventListener('click',()=>{
    modesEl.forEach(m=>m.classList.remove('active'));
    el.classList.add('active');
    currentMode=el.dataset.mode;
  });
});
document.getElementById('btnStart').addEventListener('click',()=>{
  document.getElementById('mainMenu').hidden=true;
  document.getElementById('deathScreen').hidden=true;
  initBots();setWeapon(0);respawnPlayer();
});
document.getElementById('btnRespawn').addEventListener('click',respawnPlayer);

/*============================ POINTER LOCK (desktop) ============================*/
function requestPointer(){canvas.requestPointerLock();}
canvas.addEventListener('click',()=>{if(!isMobile)requestPointer();});
document.addEventListener('pointerlockchange',()=>{});

/*============================ RENDER LOOP ============================*/
let last=performance.now();
function loop(){
  const now=performance.now();const dt=Math.min((now-last)/1000,0.05);last=now;
  updatePlayer(dt);
  updateBots(dt);

  // remote players
  const seen=new Set();
  for(const id in netState.players){
    const p=netState.players[id];
    if(p.id===netId)continue;
    seen.add(id);
    let m=remoteMeshes[id];
    if(!m){
      const col=p.team==='red'?0xff4444:p.team==='blue'?0x4488ff:0xaaaaaa;
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.8,0.7),new THREE.MeshStandardMaterial({color:col,flatShading:true}));
      mesh.castShadow=true;mesh.receiveShadow=true;
      scene.add(mesh);
      m=remoteMeshes[id]={mesh};
    }
    m.mesh.position.set(p.x,p.y,p.z);
    m.mesh.rotation.y=p.yaw||0;
    m.mesh.visible=true;
  }
  for(const id in remoteMeshes){if(!seen.has(id)){scene.remove(remoteMeshes[id].mesh);delete remoteMeshes[id];}}

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
